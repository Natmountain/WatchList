<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Watchlist">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#d9480f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Watchlist</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--text:#1d1b18;--muted:#7a746a;--line:#e5e1d8;--accent:#d9480f;--accent-t:#fff;--ok:#2f9e44;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15130f;--card:#201d18;--text:#f2eee6;--muted:#9a9386;--line:#33302a;--accent:#ff8a4c;--accent-t:#1a1208;--ok:#51cf66;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15130f;--card:#201d18;--text:#f2eee6;--muted:#9a9386;--line:#33302a;--accent:#ff8a4c;--accent-t:#1a1208;--ok:#51cf66;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:18px 16px 90px}
h1{font-size:26px;margin:4px 0 14px;letter-spacing:-.5px}
.add{display:flex;gap:8px}
.add input{flex:1;min-width:0;font:inherit;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--text)}
.add input:focus{outline:none;border-color:var(--accent)}
button{font:inherit;border:0;border-radius:12px;padding:0 16px;cursor:pointer}
.go{background:var(--accent);color:var(--accent-t);font-weight:600}
.paste{background:var(--card);color:var(--text);border:1.5px solid var(--line)}
.banner{display:none;margin:10px 0 0;padding:10px 12px;border-radius:12px;background:var(--card);border:1.5px dashed var(--accent);font-size:14px;color:var(--muted)}
.banner.on{display:block}
.search{display:block;width:100%;margin-top:16px;font:inherit;padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--text);-webkit-appearance:none;appearance:none}
.search:focus{outline:none;border-color:var(--accent)}
details.imp{margin-top:12px}
details.imp summary{cursor:pointer;color:var(--muted);font-size:14px;padding:4px 0;list-style:none}
details.imp summary::-webkit-details-marker{display:none}
details.imp summary::before{content:"＋ "}
details.imp[open] summary::before{content:"－ "}
.imp .box{margin-top:8px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.imp textarea{display:block;width:100%;min-height:130px;font:inherit;font-size:15px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--text);resize:vertical}
.imp textarea:focus{outline:none;border-color:var(--accent)}
.imp .row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.imp .row .go,.imp .row .paste{padding:11px 16px}
.imp .count{flex:1;font-size:13px;color:var(--muted);min-width:90px}
.imp .hint{font-size:12px;color:var(--muted);margin:0 0 8px}
.tabs.dim{opacity:.4}
.tabs{display:flex;gap:6px;margin:18px 0 10px}
.tabs button{padding:7px 13px;background:transparent;color:var(--muted);border:1.5px solid var(--line);border-radius:99px;font-size:14px}
.tabs button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
li{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 12px 12px 14px}
li .t{flex:1;min-width:0;overflow-wrap:anywhere}
li.done .t{color:var(--muted);text-decoration:line-through}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:transparent;padding:0;flex:none;color:var(--accent-t);font-size:15px;line-height:1}
li.done .chk{background:var(--ok);border-color:var(--ok)}
.del{background:transparent;color:var(--muted);font-size:22px;padding:0 6px;line-height:1}
.empty{text-align:center;color:var(--muted);padding:36px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.note{font-size:12px;color:var(--muted);margin-top:22px;text-align:center}
</style>
</head>
<body>
<main>
  <h1>🎬 Watchlist</h1>
  <div class="add">
    <input id="inp" type="text" placeholder="Movie or show…" autocomplete="off" autocapitalize="words" enterkeyhint="done" aria-label="Movie or show title">
    <button class="paste" id="paste" title="Paste from clipboard" aria-label="Paste from clipboard">Paste</button>
    <button class="go" id="go">Add</button>
  </div>
  <div class="banner" id="banner">Opened from your shortcut. Tap <b>Paste</b> to add the title you just typed.</div>
  <details class="imp" id="imp">
    <summary>Import a list</summary>
    <div class="box">
      <p class="hint">Paste a bulleted or numbered list, one title per line, or choose a text file. Titles already on your list are skipped.</p>
      <textarea id="bulk" placeholder="• Inception&#10;• The Office&#10;• Parasite" aria-label="List to import"></textarea>
      <div class="row">
        <label class="paste" style="padding:11px 16px;border-radius:12px;cursor:pointer">Choose file<input id="file" type="file" accept=".txt,.md,.csv,text/plain" hidden></label>
        <span class="count" id="cnt"></span>
        <button class="go" id="bulkgo" disabled>Add all</button>
      </div>
    </div>
  </details>
  <input class="search" id="q" type="search" placeholder="Search your list…" autocomplete="off" autocorrect="off" enterkeyhint="search" aria-label="Search your list">
  <div class="tabs" id="tabs">
    <button data-f="todo" class="on">To watch</button>
    <button data-f="done">Watched</button>
    <button data-f="all">All</button>
  </div>
  <ul id="list"></ul>
  <div class="note" id="note"></div>
</main>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
var $=function(s){return document.querySelector(s)};
var items=new Map(), filter='todo', store=null;
var inp=$('#inp'), qEl=$('#q'), list=$('#list'), toastEl=$('#toast'), tt;

function keyOf(t){
  var k=t.toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,100);
  if(k) return k;
  var h=0; for(var c of t) h=(h*31+c.codePointAt(0))>>>0;
  return 'x-'+h;
}
function norm(t){return t.toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'')}
function matches(title,q){var nq=norm(q);return nq?norm(title).includes(nq):title.toLowerCase().includes(q.toLowerCase())}
function toast(m,ms){toastEl.textContent=m;toastEl.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){toastEl.classList.remove('on')},ms||2400)}

/* ---------- storage: this device only (localStorage) ---------- */
var LS='watchlist-v1';
function localStore(){
  function read(){try{return JSON.parse(localStorage.getItem(LS)||'[]')}catch(e){return []}}
  function write(){try{localStorage.setItem(LS,JSON.stringify(Array.from(items.values())))}catch(e){}}
  items=new Map(read().map(function(r){return [r.id,r]}));
  return {
    set:async function(id,rec){items.set(id,Object.assign({id:id},rec));write()},
    update:async function(id,p){var r=items.get(id);if(r){items.set(id,Object.assign({},r,p));write()}},
    remove:async function(id){items.delete(id);write()}
  };
}
async function init(){
  store=localStore();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  $('#note').textContent='Saved on this device only';
  render();
}

/* ---------- actions ---------- */
async function add(raw){
  var title=(raw||'').trim().replace(/\s+/g,' ');
  if(!title||!store) return false;
  var id=keyOf(title);
  if(items.has(id)){toast('Already on your list: '+items.get(id).title);return false}
  var rec={title:title,watched:false,added:Date.now()};
  items.set(id,Object.assign({id:id},rec)); render();
  try{await store.set(id,rec);toast('Added: '+title);return true}
  catch(e){items.delete(id);render();toast('Couldn’t save on this device.');return false}
}
async function submit(){
  var ok=await add(inp.value);
  if(ok||items.has(keyOf(inp.value.trim()||'~'))) inp.value='';
}
async function pasteAdd(){
  try{
    var t=await navigator.clipboard.readText();
    if(t&&t.trim()){await add(t);inp.value='';return}
  }catch(e){}
  inp.focus();toast('Couldn’t read the clipboard. Paste it into the box.');
}
function toggle(id){var r=items.get(id);if(!r)return;var w=!r.watched;items.set(id,Object.assign({},r,{watched:w}));render();store.update(id,{watched:w}).catch(function(){})}
async function remove(id){
  var r=items.get(id);if(!r||!store)return;
  items.delete(id);render();
  try{await store.remove(id);toast('Removed: '+r.title)}
  catch(e){items.set(id,r);render();toast('Couldn’t remove. Try again.')}
}

/* ---------- import ---------- */
function parseList(text){
  var out=[], seen=new Set();
  text.replace(/\r/g,'').replace(/[•●◦▪‣∙·]/g,'\n').split('\n').forEach(function(line){
    var re=/^\s*(?:[-*–—]+\s*|\d+[.)]\s+|\[[ xX]?\]\s*)/, t=line.replace(re,'').replace(re,'').trim().replace(/\s+/g,' ');
    if(!t) return;
    var k=keyOf(t); if(seen.has(k)) return;
    seen.add(k); out.push(t);
  });
  return out;
}
async function importAll(){
  var titles=parseList($('#bulk').value);
  if(!titles.length||!store) return;
  var base=Date.now(), n=titles.length, added=0, skipped=0, jobs=[];
  titles.forEach(function(t,i){
    var id=keyOf(t);
    if(items.has(id)){skipped++;return}
    var rec={title:t,watched:false,added:base+(n-i)};
    items.set(id,Object.assign({id:id},rec));
    jobs.push(store.set(id,rec));added++;
  });
  render();
  try{await Promise.all(jobs)}catch(e){toast('Couldn’t save everything on this device.');return}
  $('#bulk').value='';updateCount();
  toast('Added '+added+(skipped?' · '+skipped+' already on your list':''),4000);
}
function updateCount(){
  var n=parseList($('#bulk').value).length;
  $('#cnt').textContent=n?n+(n===1?' title found':' titles found'):'';
  $('#bulkgo').disabled=!n;
}

/* ---------- render ---------- */
function render(){
  var all=Array.from(items.values()).sort(function(a,b){return (b.added||0)-(a.added||0)});
  var todo=all.filter(function(r){return !r.watched}), done=all.filter(function(r){return r.watched});
  var q=qEl.value.trim();
  var shown=q?all.filter(function(r){return matches(r.title,q)}):(filter==='todo'?todo:filter==='done'?done:all);
  $('#tabs').classList.toggle('dim',!!q);
  var tabs=document.querySelectorAll('#tabs button');
  tabs.forEach(function(b){
    var f=b.dataset.f, n=f==='todo'?todo.length:f==='done'?done.length:all.length;
    b.textContent=(f==='todo'?'To watch':f==='done'?'Watched':'All')+' · '+n;
    b.classList.toggle('on',f===filter);
  });
  list.textContent='';
  if(!shown.length){
    var e=document.createElement('div');e.className='empty';
    e.textContent=q?'No matches for “'+q+'”.':all.length?'Nothing here yet.':'Your list is empty. Add something above.';
    list.appendChild(e);return;
  }
  shown.forEach(function(r){
    var li=document.createElement('li');if(r.watched)li.className='done';
    var c=document.createElement('button');c.className='chk';c.setAttribute('aria-label',r.watched?'Mark as not watched':'Mark as watched');c.textContent=r.watched?'✓':'';
    c.onclick=function(){toggle(r.id)};
    var t=document.createElement('span');t.className='t';t.textContent=r.title;
    var d=document.createElement('button');d.className='del';d.setAttribute('aria-label','Remove');d.textContent='×';
    d.onclick=function(){remove(r.id)};
    li.append(c,t,d);list.appendChild(li);
  });
}

/* ---------- wiring ---------- */
$('#go').onclick=submit;
$('#bulk').addEventListener('input',updateCount);
$('#bulkgo').onclick=importAll;
$('#file').addEventListener('change',function(e){
  var f=e.target.files&&e.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){var b=$('#bulk');b.value=(b.value?b.value.replace(/\s+$/,'')+'\n':'')+String(r.result||'');updateCount()};
  r.onerror=function(){toast('Couldn’t read that file.')};
  r.readAsText(f);e.target.value='';
});
qEl.addEventListener('input',render);
qEl.addEventListener('keydown',function(e){if(e.key==='Enter')qEl.blur()});
$('#paste').onclick=pasteAdd;
inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();submit()}});
$('#tabs').onclick=function(e){var f=e.target.dataset&&e.target.dataset.f;if(f){filter=f;qEl.value='';render()}};
function checkHash(){
  var on=location.hash==='#add';
  $('#banner').classList.toggle('on',on);
  if(on){filter='todo';render()}
}
window.addEventListener('hashchange',checkHash);
checkHash();
init();
})();
</script>
</body>
</html>
